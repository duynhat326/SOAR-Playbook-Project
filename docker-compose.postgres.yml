services:
  api:
    environment:
      SOAR_DB_TARGET: ""
      SOAR_DATABASE_URL: postgresql://soar:soar@postgres:5432/soar
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    environment:
      SOAR_DB_TARGET: ""
      SOAR_DATABASE_URL: postgresql://soar:soar@postgres:5432/soar
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    profiles:
      - postgres
