services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: api
    env_file:
      - config/environments/development.env
      # Optional, git-ignored overrides (real Supabase/VirusTotal credentials); later files win.
      - path: config/environments/local.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - soar_output:/app/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: worker
    env_file:
      - config/environments/development.env
      # Optional, git-ignored overrides (real Supabase/VirusTotal credentials); later files win.
      - path: config/environments/local.env
        required: false
    volumes:
      - soar_output:/app/output
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      args:
        VITE_SOAR_API_BASE_URL: /soar-api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: soar
      POSTGRES_USER: soar
      POSTGRES_PASSWORD: soar
    ports:
      - "5432:5432"
    volumes:
      - soar_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  soar_output:
  soar_postgres:
