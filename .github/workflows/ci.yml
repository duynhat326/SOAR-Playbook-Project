name: ci

"on":
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment profiles
        run: |
          python scripts/validate_env.py \
            config/environments/development.env \
            config/environments/staging.env.example \
            config/environments/production.env.example

      - name: Python static validation
        run: python -m compileall api actions alert_generator engine enrichment integrations observability reporting schemas security services storage scripts

      - name: Run backend tests
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Build dashboard
        run: npm --prefix dashboard run build

      - name: Render Docker Compose config
        env:
          SOAR_POSTGRES_PASSWORD: ci-render-only
        run: docker compose -f docker-compose.yml -f docker-compose.postgres.yml --profile postgres config > /tmp/soar-compose.rendered.yml

      - name: Build API image
        run: docker build --target api -f docker/Dockerfile.backend -t soar-api:test .

      - name: Build worker image
        run: docker build --target worker -f docker/Dockerfile.backend -t soar-worker:test .

      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard --build-arg VITE_SOAR_API_BASE_URL=/soar-api -t soar-dashboard:test .

  publish-images:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          target: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/soar-playbook-api:${{ github.ref_name }}

      - name: Publish worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          target: worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/soar-playbook-worker:${{ github.ref_name }}

      - name: Publish dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          build-args: |
            VITE_SOAR_API_BASE_URL=/soar-api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/soar-playbook-dashboard:${{ github.ref_name }}
